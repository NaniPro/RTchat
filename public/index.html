<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RTchat</title>
  <link rel="icon" type="image/png" href="media/icon.jpg">
  <link rel="stylesheet" href="stylesheet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <script src="https://kit.fontawesome.com/ce0605f931.js" crossorigin="anonymous"></script>
  <script type="module" src="login.js"></script>
</head>

<body>
  

  <div class="container">

    <div class="headerTitle">RTchat</div>
    <i class="fa-solid fa-eye-slash" id="eyeCross"></i>
  </div>
  <div class="headerTitle2"></div>

  <div class="inputHolder">
    <span class="loginTitle">Login</span>
    <form id="loginForm">
    <input type="email" name="Email" placeholder="Email" class="input" id="email" required autocomplete="off" />
    <span class="emailError" id="emailError"></span>
    <div class="eyeContainer">
      <input type="password" placeholder="Password" class="input inputEye" id="password" />
      <button class="eyeButton" id="passbutton">
        <i class="fa-solid fa-eye"></i>
      </button>
    </div>
    <button type="submit" class="loginButton g-recaptcha" id="loginButton" data-sitekey="6LcLh8ArAAAAANx_DqP8QhO_8v5k53J1GRygA690" data-callback='onSubmit' data-action='submit'>Login</button>

    <div class="termsContainer">
      <input type="checkbox" name="checkbox" class="checkbox" id="checkBox" />
      <span class="tip"><center>I agree to the<a href="TOS/TOS.html">. Terms & Conditions.</a></center></span>
    </div>

    <span class="tip"><li class="liTip">Don't Have An <a href="register/register.html">Account</a>?</li></span>

    </form>
  </div>

  <div class="inputHolder2"></div>


  <div id="stars-container">
  <div id="stars"></div>
  <div id="stars2"></div>
  <div id="stars3"></div>
  <div class="shooting-star"></div>
</body>

</html>
